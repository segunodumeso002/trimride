<!DOCTYPE html>
<html>
<head>
    <title>Barber App Test Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: white;
            line-height: 1.6;
        }
        .container { 
            max-width: 400px; 
            margin: 0 auto; 
            background: #000000;
            min-height: 100vh;
            position: relative;
        }
        .header {
            background: #000000;
            padding: 60px 20px 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8E8E93;
            font-size: 16px;
        }
        .section { 
            background: #1C1C1E;
            margin: 12px 16px;
            padding: 20px;
            border-radius: 16px;
        }
        .section h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: white;
        }
        button { 
            background: #FFFFFF;
            color: #000000;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        button:hover { 
            background: #F2F2F7;
            transform: translateY(-1px);
        }
        .barber-card { 
            background: white;
            color: #1C1C1E;
            padding: 20px;
            margin: 12px 0;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .barber-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .barber-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #007AFF;
        }
        .stat-label {
            font-size: 12px;
            color: #8E8E93;
            margin-top: 2px;
        }
        .service-item { 
            background: #F0F8FF;
            color: #1C1C1E;
            padding: 16px;
            margin: 8px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .service-price {
            font-size: 18px;
            font-weight: 700;
            color: #007AFF;
        }
        input { 
            background: #1C1C1E;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            color: white;
            width: 100%;
            margin-bottom: 12px;
        }
        input::placeholder {
            color: #8E8E93;
        }
        .status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1C1C1E;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #8E8E93;
        }
        .loading {
            text-align: center;
            color: #8E8E93;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Find Your Barber</h1>
            <div class="subtitle">Professional barber services near you</div>
        </div>
        
        <div class="section">
            <h2>Nearby Barbers</h2>
            <button onclick="findBarbers()">Find Barbers</button>
            <div id="barbersResult"></div>
        </div>

        <div class="section">
            <h2>Login Test</h2>
            <input type="email" id="email" placeholder="Email" value="mike@barbershop.com">
            <input type="password" id="password" placeholder="Password" value="password123">
            <button onclick="testLogin()">Sign In</button>
            <div id="authResult"></div>
        </div>

        <div class="section">
            <h2>Available Services</h2>
            <button onclick="getServices()">View Services</button>
            <div id="servicesResult"></div>
        </div>

        <div class="status" id="status">Ready to test your barber app</div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';

        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(API_BASE + endpoint, {
                    headers: { 'Content-Type': 'application/json' },
                    ...options
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error);
                return data;
            } catch (error) {
                throw error;
            }
        }

        async function findBarbers() {
            document.getElementById('status').innerHTML = 'Finding barbers...';
            try {
                const barbers = await apiCall('/barbers/nearby?lat=40.7128&lng=-74.0060&radius=10');
                let html = `<h3>Found ${barbers.length} barbers:</h3>`;
                barbers.forEach(barber => {
                    html += `
                        <div class="barber-card">
                            <div class="barber-name">${barber.shop_name}</div>
                            <div style="color: #FF9500; font-weight: 500;">⭐ ${barber.rating}</div>
                            <div class="barber-stats">
                                <div class="stat">
                                    <div class="stat-number">${barber.queue_count}</div>
                                    <div class="stat-label">IN QUEUE</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-number">${barber.estimated_wait_time}</div>
                                    <div class="stat-label">MIN WAIT</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-number">${parseFloat(barber.distance).toFixed(1)}</div>
                                    <div class="stat-label">KM AWAY</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('barbersResult').innerHTML = html;
                document.getElementById('status').innerHTML = '✅ Barbers loaded successfully!';
            } catch (error) {
                document.getElementById('barbersResult').innerHTML = `❌ Error: ${error.message}`;
                document.getElementById('status').innerHTML = '❌ Failed to load barbers';
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            document.getElementById('status').innerHTML = 'Testing login...';
            try {
                const result = await apiCall('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                document.getElementById('authResult').innerHTML = `
                    <div class="result">
                        ✅ Login successful!<br>
                        User: ${result.user.firstName} ${result.user.lastName}<br>
                        Type: ${result.user.userType}<br>
                        Token: ${result.token.substring(0, 20)}...
                    </div>
                `;
                document.getElementById('status').innerHTML = '✅ Authentication successful!';
            } catch (error) {
                document.getElementById('authResult').innerHTML = `❌ Login failed: ${error.message}`;
                document.getElementById('status').innerHTML = '❌ Authentication failed';
            }
        }

        async function getServices() {
            document.getElementById('status').innerHTML = 'Loading services...';
            try {
                const services = await apiCall('/barbers/1/services');
                let html = `<h3>Available Services:</h3>`;
                services.forEach(service => {
                    html += `
                        <div class="service-item">
                            <div>
                                <div style="font-weight: 600; font-size: 16px;">${service.name}</div>
                                <div style="color: #8E8E93; font-size: 14px;">${service.duration} minutes</div>
                            </div>
                            <div class="service-price">$${service.price}</div>
                        </div>
                    `;
                });
                document.getElementById('servicesResult').innerHTML = html;
                document.getElementById('status').innerHTML = '✅ Services loaded successfully!';
            } catch (error) {
                document.getElementById('servicesResult').innerHTML = `❌ Error: ${error.message}`;
                document.getElementById('status').innerHTML = '❌ Failed to load services';
            }
        }

        // Auto-load barbers on page load
        window.onload = () => {
            findBarbers();
        };
    </script>
</body>
</html>
